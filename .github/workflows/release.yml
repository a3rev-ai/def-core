name: Build Plugin Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build plugin zip
        run: |
          # Create clean build directory
          mkdir -p build/widrow-ai

          # Copy only distributable files (no dev files, tests, CI config)
          cp def-core.php LICENSE README.md readme.txt changelog.txt build/widrow-ai/
          cp -r assets build/widrow-ai/
          cp -r includes build/widrow-ai/
          cp -r languages build/widrow-ai/
          cp -r templates build/widrow-ai/
          cp -r vendor build/widrow-ai/

          # Remove dev-only vendor packages if any
          rm -rf build/widrow-ai/vendor/bin

          # Create zip from build directory
          cd build
          zip -r ../widrow-ai.zip widrow-ai/

          # Sites on 9.6.1 or earlier look for digital-employees.zip by name, so a
          # release without it gives them no update. It goes when every live site
          # is on 9.7.0 or later (W86 W6).
          mv widrow-ai digital-employees
          zip -r ../digital-employees.zip digital-employees/

          # Verify structure
          echo "=== Zip contents (first 20 entries) ==="
          unzip -l ../widrow-ai.zip | head -25
          echo "=== Verifying main plugin file ==="
          unzip -p ../widrow-ai.zip widrow-ai/def-core.php | head -5
          unzip -p ../digital-employees.zip digital-employees/def-core.php | head -5

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            widrow-ai.zip digital-employees.zip \
            --clobber

      # Note: README download badge is updated manually as part of the
      # version-bump PR for each release (alongside def-core.php,
      # readme.txt, and changelog.txt). The previous automated step that
      # created a follow-up PR was incompatible with the repo's branch
      # protection rule that blocks GitHub Actions from creating or
      # approving PRs (that rule exists deliberately to keep a human in
      # the loop on every merge). Rather than weaken the guardrail, the
      # badge bump is folded into each release PR.
